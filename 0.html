<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            user-select: none;
            transition: background-color 3s ease;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            z-index: 20;
            transition: opacity 1s ease;
            pointer-events: auto;
        }

        .game-title {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .game-title span:nth-child(1) { font-weight: 700; } /* G */
        .game-title span:nth-child(2) { font-weight: 700; } /* A */

        .start-btn {
            margin-top: 2rem;
            padding: 1rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 10, 0.85);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            font-family: 'Space Mono', monospace;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 31;
        }

        .msg-text {
            color: #55ffaa;
            font-size: 1.5rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(85, 255, 170, 0.5);
            margin-bottom: 2rem;
        }

        .glitch {
            animation: glitch 1s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }

        #hud {
            position: absolute;
            top: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .progress-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #55ffaa, #00eeff);
            box-shadow: 0 0 10px #55ffaa;
            transition: width 0.5s ease;
        }

        #hint {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="title-screen" id="titleScreen">
            <h1 class="game-title"><span>G</span><span>A</span>me</h1>
            <p class="mt-4 text-gray-400 font-light tracking-widest text-sm">A systematic harmonization protocol</p>
            <button class="start-btn" onclick="startGame()">Initiate</button>
        </div>

        <div id="hud">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div id="hint">Move cursor to project harmonization field. Click to pulse.</div>
    </div>

    <!-- The Messenger System Interface -->
    <div id="message-overlay">
        <div class="scanlines"></div>
        <div class="msg-text" id="msgText"></div>
        <p class="text-xs text-gray-500 tracking-widest mt-8 animate-pulse">[ INCOMING TRANSMISSION ]</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const titleScreen = document.getElementById('titleScreen');
        const hud = document.getElementById('hud');
        const hint = document.getElementById('hint');
        const progressBar = document.getElementById('progressBar');
        const messageOverlay = document.getElementById('message-overlay');
        const msgText = document.getElementById('msgText');

        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 100, isDown: false };
        let isPlaying = false;
        let isPausedForMessage = false;
        
        let totalParticles = 400;
        let healedCount = 0;
        let currentLevel = 0;

        // The true nature of the game revealed in stages
        const narrativeMessages = [
            { threshold: 0.25, displayed: false, text: "System anomaly detected... Wait. You are not a standard operator. The signal is holding. Keep stabilizing the field." },
            { threshold: 0.50, displayed: false, text: "Temporal bridge established. We are reaching you from Year 2184. The 'corruption' you see was our history. You are altering the baseline." },
            { threshold: 0.75, displayed: false, text: "The sky here just changed color. Forests long dead are breathing again. The choices you make there... they build our tomorrow." },
            { threshold: 0.99, displayed: false, text: "Protocol Complete. We survived. We thrived. But it started with you. The GAme is over. The real world awaits your touch.\n\nThank you, Ancestor." }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Adjust particle count for mobile
            if (width < 768) {
                totalParticles = 200;
                mouse.radius = 80;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse & Touch interactions
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        window.addEventListener('mousedown', () => { mouse.isDown = true; mouse.radius = 200; });
        window.addEventListener('mouseup', () => { mouse.isDown = false; mouse.radius = 100; });
        window.addEventListener('touchstart', (e) => { 
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.isDown = true; 
            mouse.radius = 150; 
        });
        window.addEventListener('touchend', () => { mouse.isDown = false; mouse.radius = 100; });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 1;
                
                // State
                this.isHealed = false;
                
                // Corrupted visual
                this.color = `rgba(50, 40, 50, ${Math.random() * 0.5 + 0.2})`;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();

                if (this.isHealed) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }

            update() {
                // Interaction with mouse/player aura
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < maxDistance && !isPausedForMessage) {
                    // Heal particle
                    if (!this.isHealed) {
                        this.heal();
                    }
                    
                    // Push away slightly when healing, or pull if clicking
                    if (mouse.isDown) {
                        this.x += directionX * 2;
                        this.y += directionY * 2;
                    } else {
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                } else {
                    // Return to base or wander based on state
                    if (this.isHealed) {
                        // Healed particles wander beautifully
                        this.x += Math.sin(Date.now() * 0.001 + this.baseX) * 0.5;
                        this.y += Math.cos(Date.now() * 0.001 + this.baseY) * 0.5;
                    } else {
                        // Corrupted particles jiggle aggressively but move slowly
                        this.x += this.vx + (Math.random() - 0.5) * 0.5;
                        this.y += this.vy + (Math.random() - 0.5) * 0.5;

                        // Wrap around screen
                        if(this.x < 0) this.x = width;
                        if(this.x > width) this.x = 0;
                        if(this.y < 0) this.y = height;
                        if(this.y > height) this.y = 0;
                    }
                }
            }

            heal() {
                this.isHealed = true;
                healedCount++;
                this.size = Math.random() * 3 + 2;
                
                // Pick a beautiful utopian color
                const colors = ['#55ffaa', '#00eeff', '#ffffff', '#eebbff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                updateProgress();
            }
        }

        function initParticles() {
            particles = [];
            healedCount = 0;
            for (let i = 0; i < totalParticles; i++) {
                particles.push(new Particle());
            }
            updateProgress();
        }

        function updateProgress() {
            let ratio = healedCount / totalParticles;
            progressBar.style.width = `${ratio * 100}%`;

            // Change global background based on healing
            let targetR = Math.floor(5 + (ratio * 10));  // 5 to 15
            let targetG = Math.floor(5 + (ratio * 30));  // 5 to 35
            let targetB = Math.floor(5 + (ratio * 40));  // 5 to 45
            document.body.style.backgroundColor = `rgb(${targetR}, ${targetG}, ${targetB})`;

            checkNarrativeTriggers(ratio);
        }

        async function checkNarrativeTriggers(ratio) {
            for (let i = 0; i < narrativeMessages.length; i++) {
                let msg = narrativeMessages[i];
                if (ratio >= msg.threshold && !msg.displayed) {
                    msg.displayed = true;
                    await triggerMessage(msg.text);
                }
            }
        }

        function triggerMessage(text) {
            return new Promise(resolve => {
                isPausedForMessage = true;
                messageOverlay.style.pointerEvents = 'auto';
                messageOverlay.style.opacity = '1';
                msgText.innerHTML = '';
                msgText.classList.add('glitch');

                let i = 0;
                let speed = 40; // typing speed

                function typeWriter() {
                    if (i < text.length) {
                        if(text.charAt(i) === '\n') {
                            msgText.innerHTML += '<br>';
                        } else {
                            msgText.innerHTML += text.charAt(i);
                        }
                        i++;
                        // Sound effect simulation via variation in timing
                        setTimeout(typeWriter, speed + (Math.random() * 30));
                    } else {
                        msgText.classList.remove('glitch');
                        setTimeout(() => {
                            closeMessage(resolve);
                        }, 4000); // Read time
                    }
                }

                setTimeout(typeWriter, 1000); // Initial delay
            });
        }

        function closeMessage(resolveCallback) {
            messageOverlay.style.opacity = '0';
            messageOverlay.style.pointerEvents = 'none';
            setTimeout(() => {
                isPausedForMessage = false;
                resolveCallback();
            }, 1000);
        }

        function animate() {
            if (!isPlaying) return;
            
            requestAnimationFrame(animate);
            
            // Clear screen with a slight trail effect
            ctx.fillStyle = isPausedForMessage ? 'rgba(0, 0, 0, 0.1)' : 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Draw player aura if playing
            if (!isPausedForMessage && mouse.x > 0) {
                let gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, mouse.radius);
                gradient.addColorStop(0, mouse.isDown ? 'rgba(85, 255, 170, 0.15)' : 'rgba(85, 255, 170, 0.05)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Update and draw particles
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function startGame() {
            titleScreen.style.opacity = '0';
            setTimeout(() => {
                titleScreen.style.display = 'none';
                hud.style.opacity = '1';
                hint.style.opacity = '1';
                
                // Hide hint after 6 seconds
                setTimeout(() => {
                    hint.style.opacity = '0';
                }, 6000);

                isPlaying = true;
                initParticles();
                animate();
            }, 1000);
        }

        // Draw initial static background before start
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
